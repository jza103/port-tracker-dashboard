# Where the dashboard gets its information. Every run of the updater
# (every 4 hours on GitHub Actions) reads this file.

settings:
  # owner/repo of this dashboard. Used for "Save to GitHub" links.
  # On GitHub Actions this is filled in automatically.
  repo: jza103/port-tracker-dashboard
  # Keep news articles for this many days.
  newsDays: 120
  # A project counts as "active" if it had a commit or release this recently.
  activeDays: 120
  # Projects first seen within this many days get a NEW badge.
  newDays: 14

# Curated catalogs. Everything listed in them is followed automatically,
# so new ports added there show up here without you doing anything.
catalogs:
  - id: portsdr
    name: PortsDR
    type: portsdr
    url: https://portsdr.com/
  - id: questports
    name: QuestPorts
    type: questports
    url: https://questports.vercel.app/
    category: VR Ports        # added to every project from this catalog
  - id: quiver
    name: Quiver Launcher
    type: quiver
    url: https://quiverlauncher.com/
  # PC VR mods for flat games (UEVR profiles, R.E.A.L., standalone mods...),
  # read from the catalog file of the PCVR Mods Installer Hub.
  - id: pcvrhub
    name: PCVR Mods Hub
    type: pcvrhub
    url: https://github.com/Mr-Nlce/PCVR-Mods-Installer-Hub
  # FPGA cores. MiSTer cores carry their update_all status: on by default
  # (main distribution, JTCORES, Coin-Op), in an optional update_all
  # database, or "manual install" for cores found anywhere else.
  - id: mister
    name: MiSTer (update_all)
    type: mister
    url: https://github.com/MiSTer-devel/Wiki_MiSTer/wiki/Cores
  - id: pocket
    name: openFPGA inventory
    type: pocket
    url: https://openfpga-cores-inventory.github.io/analogue-pocket/

# News outlets. Articles must match one of the keywords below (unless
# filter: all). GitHub links found in matching articles are followed
# automatically as new projects.
news:
  keywords:
    - decomp(ilation|iled)?
    - recomp(ilation|iled)?
    - static recompil\w*
    - reverse[- ]engineer\w*
    - source port
    - (native|unofficial|fan[- ]made|fan) (pc )?port
    - vr (mod|conversion)
    - (fan|unofficial|community|free)[- ]?(made )?vr
    - (standalone|unofficial|fan|native) (vr|quest) port
    - sidequest
    - flat2vr
    - team beef
    - uevr
    - harbour ?masters
    - ship of harkinian
    - 2 ?ship 2 ?harkinian
    - "n64: ?recompiled"
    - n64recomp
    - xenonrecomp
    - rexglue
    - ps2recomp
    - opengoal
    - mister ?fpga
    - misterfpga
    - mister (core|cores|update|updates)
    - fpga
    - openfpga
    - analogue pocket
    - update_all
    - jotego
    - jtcores
  # Extra keywords for YouTube channels (feeds marked video: true). VR mods
  # mostly show up on YouTube first, as "<game> in VR" videos.
  videoKeywords:
    - in (full |true |native |proper |real )?(6dof )?vr
    - (to|into|for) vr
    - vr (mods?|ports?|patch|conversion|version|update|support)
    - r\.?e\.?a\.?l\.? ?vr
    - luke ross
    - praydog
    - openxr
  feeds:
    - { name: ReadOnlyMemo, url: "https://readonlymemo.com/rss/", filter: all }
    - { name: Time Extension, url: "https://www.timeextension.com/feeds/latest" }
    - { name: GamingOnLinux, url: "https://www.gamingonlinux.com/article_rss.php" }
    - { name: UploadVR, url: "https://www.uploadvr.com/rss/" }
    - { name: Road to VR, url: "https://www.roadtovr.com/feed/" }
    - { name: MIXED, url: "https://mixed-news.com/en/feed/" }
    - { name: VGC, url: "https://www.videogameschronicle.com/feed/" }
    - { name: PC Gamer, url: "https://www.pcgamer.com/feeds.xml" }
    - { name: Nintendo Life, url: "https://www.nintendolife.com/feeds/latest" }
    - { name: Push Square, url: "https://www.pushsquare.com/feeds/latest" }
    - { name: Pure Xbox, url: "https://www.purexbox.com/feeds/latest" }
    - { name: GoNintendo, url: "https://gonintendo.com/feeds/all.xml" }
    - { name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/gaming" }
    - { name: Tom's Hardware, url: "https://www.tomshardware.com/feeds/all" }
    - { name: XDA, url: "https://www.xda-developers.com/feed/" }
    - { name: Retro Dodo, url: "https://retrododo.com/feed/" }
    - { name: RetroRGB, url: "https://www.retrorgb.com/feed" }
    - { name: Retro Handhelds, url: "https://retrohandhelds.gg/feed/" }
    - { name: Hackaday, url: "https://hackaday.com/feed/" }
    - { name: Wccftech, url: "https://wccftech.com/feed/" }
    - { name: Rock Paper Shotgun, url: "https://www.rockpapershotgun.com/feed" }
    - { name: Kotaku, url: "https://kotaku.com/rss" }
    - { name: The Verge, url: "https://www.theverge.com/rss/index.xml" }
    - name: Google News
      url: "https://news.google.com/rss/search?q=decompilation+OR+recompilation+OR+recompiled+OR+%22PC+port%22+OR+%22VR+port%22&hl=en-US&gl=US&ceid=US:en"
      aggregator: true        # links go through Google, so no GitHub links to find
