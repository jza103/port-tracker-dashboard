  - { repo: hedge-dev/XenonRecomp, name: XenonRecomp, game: XenonRecomp (Xbox 360 toolchain), category: Tools & Recompilers, type: tool }
  - { repo: rexglue/rexglue-sdk, name: ReXGlue SDK, game: ReXGlue (Xbox 360 toolchain), category: Tools & Recompilers, type: tool }
  - { repo: ran-j/PS2Recomp, name: PS2Recomp, game: PS2Recomp (PS2 toolchain), category: Tools & Recompilers, type: tool }

