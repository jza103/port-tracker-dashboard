# Your projects and preferences.
#
# You can edit this file directly on GitHub (pencil icon), or use the buttons
# on the dashboard: they queue changes and "Save to GitHub" opens a pre-filled
# issue that a workflow applies to this file automatically.
#
# Project ids are "owner/repo" for GitHub, "gitlab:owner/repo" for GitLab,
# or "<catalog>:<slug>" for catalog entries without a repo. The id is shown
# in each project's menu on the dashboard.

# Projects you never want to see (unfollowed).
hidden: []

# Projects always shown first for their game, even if another one is more popular.
pinned: []

# Discovered projects you chose to follow (from the Discovered tab).
follow: []

# Projects to track that the catalogs don't cover. Only "repo" (or "url") is
# required; the rest is guessed if left out.
#   repo:     owner/repo, a GitHub/GitLab URL, or gitlab:owner/repo
#   url:      for projects without a repo (itch.io, website, Patreon...)
#   game:     projects with the same game are grouped together
#   category: platform or group, e.g. "Nintendo 64", "PlayStation 4", "VR Ports"
#   type:     decompilation | recompilation | port | source-port | reimplementation | mod | tool | emulator
#   tags:     extra labels, e.g. [VR]
#   links:    [{ label: Website, url: https://... }]
#   progress: for decompilations that don't publish a number: complete, or e.g. 75
projects:
  # --- Decompilations (source code, usually no playable build) ---
  - { repo: zeldaret/oot, name: OoT Decompilation, game: "The Legend of Zelda: Ocarina of Time", category: Nintendo 64, type: decompilation }
