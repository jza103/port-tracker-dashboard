name: Update dashboard

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["config/**", "site/**", "scripts/**", "package*.json", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch projects, releases and news
        run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save discovered projects and news archive
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update dashboard data"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
